services:
  supercharger-planner:
    build:
      context: .
      dockerfile: Dockerfile
      # Red Hat Hardened Images Python stream (builder + runtime multi-stage)
      args:
        PYTHON_HI_VERSION: "3.12"
    image: tesla-supercharger-planner:hi-3.12
    container_name: tesla-supercharger-planner
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      # HI publish defaults — cost-conscious (no Amplify/Lambda/S3 app path)
      - COST_PROFILE=lean
      # Platform UA redirect on `/` is ON by default (Tesla→/tesla, mobile→/mobile).
      # Escape hatch per request: ?desktop=1. To disable redirects entirely:
      # - PLATFORM_UA_REDIRECT=0
      # Optional overrides (lean defaults: geocode 12/min, plan 4/min, concurrent 2):
      # - GEOCODE_RATE_LIMIT=12
      # - PLAN_RATE_LIMIT=4
      # - MAX_CONCURRENT_PLANS=2
      # - STATIC_CACHE_MAX_AGE=300
      # Behind a reverse proxy that sets/overwrites X-Forwarded-For (default OFF — avoids spoofing):
      # - TRUST_PROXY=1
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    # Match non-root HI runtime USER 65532
    user: "65532:65532"
    mem_limit: 512m
    pids_limit: 256
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=5)",
        ]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
