services:
  stalltrip:
    build:
      context: .
      dockerfile: Dockerfile
      # Red Hat Hardened Images Python stream (builder + runtime multi-stage)
      args:
        PYTHON_HI_VERSION: "3.12"
        APP_VERSION: "1.0.4"
    image: stalltrip:1.0.4
    container_name: stalltrip
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      # HI publish defaults — cost-conscious (no Amplify/Lambda/S3 app path)
      - COST_PROFILE=lean
      # Platform UA redirect on `/` is ON by default (Tesla→/tesla, mobile→/mobile).
      # Escape hatch per request: ?desktop=1. To disable redirects entirely:
      # - PLATFORM_UA_REDIRECT=0
      # Optional overrides (lean defaults: geocode 12/min, plan 4/min, concurrent 2):
      # - GEOCODE_RATE_LIMIT=12
      # - PLAN_RATE_LIMIT=4
      # - MAX_CONCURRENT_PLANS=2
      # - STATIC_CACHE_MAX_AGE=300
      # Behind a reverse proxy that sets/overwrites X-Forwarded-For (default OFF — avoids spoofing):
      # - TRUST_PROXY=1
      # - TRUST_PROXY_HOPS=1   # peel this many hops from the right of XFF (default 1)
      # Logging (stdout → `docker compose logs`; no paid SaaS required):
      # - LOG_LEVEL=INFO
      # - CLIENT_LOG_RATE_LIMIT=20
      # - CLIENT_LOG_GLOBAL_RATE_LIMIT=200
      # - ACCESS_LOG_STATIC_SAMPLE=20
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    # Match non-root HI runtime USER 65532
    user: "65532:65532"
    mem_limit: 512m
    pids_limit: 256
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/health' % os.environ.get('PORT','8080'), timeout=5)",
        ]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
