services:
  supercharger-planner:
    build:
      context: .
      dockerfile: Dockerfile
      # Red Hat Hardened Images Python stream (builder + runtime multi-stage)
      args:
        PYTHON_HI_VERSION: "3.12"
    image: tesla-supercharger-planner:hi-3.12
    container_name: tesla-supercharger-planner
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 512m
    pids_limit: 256
